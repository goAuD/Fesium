name: Semgrep

# Semgrep only ever diff-scanned pull requests here, and a diff scan cannot
# close anything: a finding on the default branch stays Open until a *full*
# scan of that branch stops reporting it. Five findings therefore sat open for
# ten days after the code that caused them was fixed and merged.

on:
  push:
    branches: [main]
  # A weekly run keeps the list honest while main is quiet. Rules ship
  # continuously, and a rule published today has never seen code merged
  # yesterday.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-scan:
    name: full scan
    runs-on: ubuntu-latest
    # Forks have no token, and a fork's pull request must not fail on a secret
    # it was never going to get.
    if: github.repository == 'goAuD/Fesium'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Deliberately unpinned, unlike the actions above. An action is code that
      # runs in the workflow, so a mutable tag there is a supply-chain risk. A
      # scanner is the opposite: pinning it freezes the rules it knows about,
      # and a scanner that cannot see this year's vulnerabilities is worse than
      # one that updates.
      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Full scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "SEMGREP_APP_TOKEN is not set, so results cannot be uploaded."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "Running an unauthenticated scan so the job still reports something."
            semgrep --config p/default --config p/python --config p/security-audit \
                    --config p/github-actions --metrics=off --error
          else
            semgrep ci
          fi
