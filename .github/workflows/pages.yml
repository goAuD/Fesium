name: Pages

# The page is generated by scripts/build_site.py and committed, so this job only
# uploads it. Generating in CI instead would mean the only copy of the site that
# anyone ever sees is one nobody reviewed, and a test already fails if the
# committed page and its generator disagree.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: read the repo, and the two scopes the deployment itself needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-way - a cancelled deploy
# can leave the site serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to full commit SHAs, not tags: a tag is mutable and
      # its owner can silently repoint it.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
