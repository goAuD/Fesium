[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fesium"
dynamic = ["version"]
description = "Local dev tools for students and developers"
readme = "README.md"
# 3.10 is the real floor: PEP 604 annotations (`Path | None`) are built at
# import time, and type.__or__ only exists from 3.10 on.
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "customtkinter>=5.0.0",
  # customtkinter imports PIL for CTkImage but does not declare it, and Fesium
  # tints its bundled icons through Pillow at runtime.
  "pillow>=9.0.0",
]

[project.scripts]
fesium = "fesium.app:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade, B bugbear,
# C4 comprehensions. UP is worth having now that the floor is 3.10: it keeps
# the annotations in one style instead of a mix of typing.Dict and dict.
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# Both files put sys.path in order before importing the package, which is the
# whole reason they exist.
"fesium.py" = ["E402"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# A test that hangs dumps every thread's traceback and ends the run, naming
# the file and the line it blocked on. This exists because a macOS CI job
# stalled three times inside Run tests, always past the last passing test and
# into the first one that creates a Tk root - with no output to say where.
# 60s is far above the slowest honest test and far below the job's 15-minute
# timeout, so a hang costs a minute of evidence instead of a quarter hour of
# silence.
faulthandler_timeout = 60

[tool.setuptools]
package-dir = {"" = "src"}

# The version lives in src/fesium/_version.py so the package and the package
# metadata can never drift apart.
[tool.setuptools.dynamic]
version = {attr = "fesium._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# Fesium is offline-first: the fonts and icons it renders with are bundled, so
# they have to travel with the package. Font licences ship alongside the fonts,
# as the OFL requires. `icons/` has no __init__.py, so it is declared as data
# of its parent package.
[tool.setuptools.package-data]
"fesium.assets" = [
  "icons/*.png",
  "icons/*.ico",
  "icons/lucide/*.png",
  "icons/lucide/*.svg",
  "icons/lucide/*.txt",
  "php/*.php",
]
"fesium.assets.fonts" = ["*.ttf", "*.md", "licenses/*.txt"]
